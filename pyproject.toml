[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-recorder"
version = "0.1.0"
description = "Recorder and transcriber tool using Whisper and optional GPT-4o summarization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer",
  "sounddevice",
  "pyaudio",
  "numpy",
  "torch>=2.1.0,<3.0.0",
  "torchaudio>=2.1.0,<3.0.0",
  "openai-whisper>=1.0.0",
  "pyannote.audio<3.0",
  "rich",
  "psutil",
  "platformdirs",
  "openai",
  "yt-dlp",
]
optional-dependencies = { dev = ["pytest"] }

[project.scripts]
whisper-recorder = "whisper_recorder.cli:app"